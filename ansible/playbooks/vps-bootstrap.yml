---
# Targets group `vps_bootstrap` (inventory generated by ./bootstrap-vps.sh from .env — SSH to VPS only).
- name: Bootstrap VPS controller (Docker, firewall, Jenkins Compose)
  hosts: vps_bootstrap
  become: true
  gather_facts: true

  roles:
    - role: vps-bootstrap

  post_tasks:
    - name: Backup reminder for Jenkins volume
      ansible.builtin.debug:
        msg: >-
          Schedule encrypted backups of the Jenkins Docker volume per docs/runbooks/backup-jenkins-volume.md
          (target RTO/RPO in docs/runbooks/disaster-recovery-rpo-rto.md).
