[defaults]
# Basic configuration
inventory = inventory/jetson-lan/hosts.yml
roles_path = roles
# Use /tmp (sticky) as base; Ansible creates unique ansible-tmp-* dirs. Avoids a fixed shared dir with mixed root/ubuntu perms.
remote_tmp = /tmp
host_key_checking = False
gathering = smart
fact_caching = memory
timeout = 30
remote_user = jetson

# SSH configuration - disabled multiplexing for stability
transport = ssh
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ConnectTimeout=10

# Output configuration
stdout_callback = default
stderr_callback = default
result_format = yaml
display_skipped_hosts = False
display_ok_hosts = True
deprecation_warnings = False

# Performance tuning
pipelining = True
forks = 5

# Privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[ssh_connection]
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ConnectTimeout=10
pipelining = True 