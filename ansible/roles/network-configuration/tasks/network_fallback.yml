---
# Network Fallback Configuration Tasks

- name: Display network fallback configuration
  debug:
    msg:
      - "Configuring Network Fallback Strategy"
      - "Mode: {{ network_strategy.connection_mode }}"
      - "Primary preference: {{ network_strategy.primary_interface_preference }}"
      - "Check interval: {{ network_strategy.fallback_check_interval }}s"
  tags: [network, fallback]

- name: Configure NetworkManager for connection priorities
  block:
    - name: Set ethernet connection priority (higher = preferred)
      shell: |
        if nmcli connection show {{ ethernet_config.interface_name }} >/dev/null 2>&1; then
          nmcli connection modify {{ ethernet_config.interface_name }} connection.autoconnect-priority {{ '100' if network_strategy.primary_interface_preference == 'ethernet' else '50' }}
        fi
      become: true
      register: ethernet_priority_result
      changed_when: ethernet_priority_result.rc == 0
      failed_when: false
      tags: [network, fallback, ethernet]

    - name: Set WiFi connection priority
      shell: |
        if nmcli connection show "{{ wifi_config.ssid }}" >/dev/null 2>&1; then
          nmcli connection modify "{{ wifi_config.ssid }}" connection.autoconnect-priority {{ '100' if network_strategy.primary_interface_preference == 'wifi' else '50' }}
        fi
      become: true
      register: wifi_priority_result
      changed_when: wifi_priority_result.rc == 0
      failed_when: false
      tags: [network, fallback, wifi]

    - name: Enable connection auto-retry for ethernet
      shell: |
        if nmcli connection show {{ ethernet_config.interface_name }} >/dev/null 2>&1; then
          nmcli connection modify {{ ethernet_config.interface_name }} connection.autoconnect-retries 0
        fi
      become: true
      register: ethernet_retry_result
      changed_when: ethernet_retry_result.rc == 0
      failed_when: false
      tags: [network, fallback, ethernet]

    - name: Enable connection auto-retry for WiFi
      shell: |
        if nmcli connection show "{{ wifi_config.ssid }}" >/dev/null 2>&1; then
          nmcli connection modify "{{ wifi_config.ssid }}" connection.autoconnect-retries 0
        fi
      become: true
      register: wifi_retry_result
      changed_when: wifi_retry_result.rc == 0
      failed_when: false
      tags: [network, fallback, wifi]

  when: network_strategy.connection_mode == "parallel"

- name: Create network monitoring script
  copy:
    content: |
      #!/bin/bash
      # Network Fallback Monitoring Script
      # Generated by Sentience Robotics Jetson Setup
      
      ETHERNET_INTERFACE="{{ ethernet_config.interface_name }}"
      WIFI_SSID="{{ wifi_config.ssid }}"
      CHECK_INTERVAL="{{ network_strategy.fallback_check_interval }}"
      PRIMARY_PREFERENCE="{{ network_strategy.primary_interface_preference }}"
      
      LOG_FILE="/var/log/network-fallback.log"
      
      log_message() {
          echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" >> "$LOG_FILE"
      }
      
      check_interface_connectivity() {
          local interface=$1
          if ip link show "$interface" up >/dev/null 2>&1 && ip addr show "$interface" | grep -q "inet "; then
              # Test connectivity with ping to 8.8.8.8
              if ping -c 1 -W 2 -I "$interface" 8.8.8.8 >/dev/null 2>&1; then
                  return 0
              fi
          fi
          return 1
      }
      
      check_wifi_connectivity() {
          local wifi_interface=$(nmcli device status | grep wifi | grep connected | awk '{print $1}' | head -1)
          if [ -n "$wifi_interface" ] && nmcli connection show --active | grep -q "$WIFI_SSID"; then
              if ping -c 1 -W 2 -I "$wifi_interface" 8.8.8.8 >/dev/null 2>&1; then
                  return 0
              fi
          fi
          return 1
      }
      
      while true; do
          ethernet_ok=false
          wifi_ok=false
          
          if check_interface_connectivity "$ETHERNET_INTERFACE"; then
              ethernet_ok=true
          fi
          
          if check_wifi_connectivity; then
              wifi_ok=true
          fi
          
          # Log current status
          status="Ethernet: $([ "$ethernet_ok" = true ] && echo "OK" || echo "FAILED"), WiFi: $([ "$wifi_ok" = true ] && echo "OK" || echo "FAILED")"
          log_message "Network status check - $status"
          
          # Handle failover based on strategy
          if [ "$PRIMARY_PREFERENCE" = "ethernet" ]; then
              if [ "$ethernet_ok" = false ] && [ "$wifi_ok" = true ]; then
                  log_message "Ethernet failed, WiFi available - ensuring WiFi connection priority"
                  nmcli connection up "$WIFI_SSID" >/dev/null 2>&1
              elif [ "$ethernet_ok" = true ] && [ "$wifi_ok" = false ]; then
                  log_message "WiFi failed, Ethernet available - ensuring Ethernet connection priority"
                  nmcli connection up "$ETHERNET_INTERFACE" >/dev/null 2>&1
              fi
          else
              if [ "$wifi_ok" = false ] && [ "$ethernet_ok" = true ]; then
                  log_message "WiFi failed, Ethernet available - ensuring Ethernet connection priority"
                  nmcli connection up "$ETHERNET_INTERFACE" >/dev/null 2>&1
              elif [ "$wifi_ok" = true ] && [ "$ethernet_ok" = false ]; then
                  log_message "Ethernet failed, WiFi available - ensuring WiFi connection priority"
                  nmcli connection up "$WIFI_SSID" >/dev/null 2>&1
              fi
          fi
          
          sleep "$CHECK_INTERVAL"
      done
    dest: /usr/local/bin/network-fallback-monitor.sh
    mode: '0755'
    owner: root
    group: root
  become: true
  tags: [network, fallback, monitoring]

- name: Create systemd service for network fallback monitoring
  copy:
    content: |
      [Unit]
      Description=Network Fallback Monitoring Service
      After=network.target NetworkManager.service
      Wants=NetworkManager.service
      
      [Service]
      Type=simple
      ExecStart=/usr/local/bin/network-fallback-monitor.sh
      Restart=always
      RestartSec=10
      User=root
      
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/network-fallback.service
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: reload systemd
  tags: [network, fallback, service]

- name: Enable and start network fallback service
  systemd:
    name: network-fallback
    enabled: yes
    state: started
    daemon_reload: yes
  become: true
  tags: [network, fallback, service]

- name: Display network fallback summary
  debug:
    msg:
      - "Network Fallback Configuration Complete!"
      - "Monitoring service: Enabled and running"
      - "Connection priorities configured"
      - "Primary preference: {{ network_strategy.primary_interface_preference }}"
      - "Logs available at: /var/log/network-fallback.log"
  tags: [network, fallback] 