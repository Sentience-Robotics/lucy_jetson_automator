---
# Container Platform Setup Tasks

- name: Display container platform information
  debug:
    msg:
      - "🐳 Starting Container Platform Setup"
      - "🖥️  Target: {{ inventory_hostname }} ({{ ansible_host }})"
      - "🔧 Installing Docker Engine and NVIDIA Container Runtime"
  when: display_container_info | default(true)
  tags: [docker, containers]

- name: Check if Docker is already installed
  command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false
  tags: [docker, containers]

- name: Check if Docker repository is already configured
  stat:
    path: /etc/apt/sources.list.d/docker.list
  register: docker_repo_check
  tags: [docker, containers]

- name: Check apt package cache status
  command: apt-cache policy docker-ce
  register: apt_cache_check
  changed_when: false
  failed_when: false
  become: true
  tags: [docker, containers]

- name: Clean conflicting Docker repository configurations
  block:
    - name: Remove conflicting Docker sources
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/keyrings/docker.gpg
      become: true

    - name: Clean apt cache after removing conflicts
      command: apt clean
      become: true

    - name: Update package cache after cleanup
      apt:
        update_cache: true
      become: true

  when: 
    - docker_check.rc != 0
    - "'E:Conflicting values' in apt_cache_check.stderr or 'E:The list of sources could not be read' in apt_cache_check.stderr"
  tags: [docker, containers]

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: true
  when: docker_check.rc != 0
  tags: [docker, containers]

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=arm64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: true
  when: docker_check.rc != 0
  tags: [docker, containers]

- name: Update package cache after adding Docker repository
  apt:
    update_cache: true
  become: true
  when: docker_check.rc != 0
  tags: [docker, containers]

- name: Install Docker packages
  apt:
    name: "{{ docker_packages }}"
    state: present
  become: true
  when: 
    - docker_config.install_docker | default(true)
    - docker_check.rc != 0
  tags: [docker, containers]

- name: Check if NVIDIA Container Toolkit is installed
  command: nvidia-container-runtime --version
  register: nvidia_toolkit_check
  changed_when: false
  failed_when: false
  tags: [docker, containers, nvidia]

- name: Install NVIDIA Container Toolkit
  apt:
    name: "{{ nvidia_packages }}"
    state: present
  become: true
  when: 
    - nvidia_container.install_toolkit | default(true)
    - nvidia_toolkit_check.rc != 0
  tags: [docker, containers, nvidia]

- name: Check if user is already in docker group
  command: groups {{ ansible_user }}
  register: user_groups
  changed_when: false
  tags: [docker, containers]

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true
  when: 
    - docker_config.add_user_to_group | default(true)
    - "'docker' not in user_groups.stdout"
  tags: [docker, containers]

- name: Check current Docker daemon configuration
  stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_config
  tags: [docker, containers, nvidia]

- name: Read existing Docker daemon configuration
  slurp:
    src: /etc/docker/daemon.json
  register: existing_daemon_config
  when: docker_daemon_config.stat.exists
  become: true
  tags: [docker, containers, nvidia]

- name: Check if NVIDIA runtime is already configured
  set_fact:
    nvidia_runtime_configured: "{{ 
      docker_daemon_config.stat.exists and 
      existing_daemon_config is defined and 
      (existing_daemon_config.content | b64decode | from_json).get('default-runtime', '') == 'nvidia'
    }}"
  when: docker_daemon_config.stat.exists
  tags: [docker, containers, nvidia]

- name: Configure NVIDIA Container Runtime
  block:
    - name: Configure Docker daemon for NVIDIA runtime
      copy:
        content: |
          {
            "default-runtime": "nvidia",
            "runtimes": {
              "nvidia": {
                "path": "nvidia-container-runtime",
                "runtimeArgs": []
              }
            }
          }
        dest: /etc/docker/daemon.json
        backup: true
      become: true
      notify: restart docker

    - name: Restart Docker service
      systemd:
        name: docker
        state: restarted
        enabled: yes
      become: true

  when: 
    - nvidia_container.configure_runtime | default(true)
    - not (nvidia_runtime_configured | default(false))
  tags: [docker, containers, nvidia]

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started
  become: true
  when: docker_config.enable_service | default(true)
  tags: [docker, containers]

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  tags: [docker, containers]

- name: Verify NVIDIA Container Runtime
  command: docker run --rm --gpus all nvidia/cuda:11.8-base-ubuntu22.04 nvidia-smi
  register: nvidia_test
  changed_when: false
  failed_when: false
  become_user: "{{ ansible_user }}"
  tags: [docker, containers, nvidia]

- name: Container platform summary
  debug:
    msg:
      - "🎯 Container Platform Setup Complete!"
      - "🐳 Docker: {{ docker_version.stdout }}"
      - "🖥️  NVIDIA Runtime: {{ 'Available' if nvidia_test.rc == 0 else 'Not available (check GPU access)' }}"
      - "👤 User '{{ ansible_user }}' added to docker group"
      - "✅ Container platform ready for robotics workloads"
  tags: [docker, containers] 