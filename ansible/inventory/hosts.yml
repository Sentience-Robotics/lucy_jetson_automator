---
all:
  children:
    jetson_devices:
      hosts:
        jetson:
          ansible_host: "{{ lookup('env', 'JETSON_HOST') | default('192.168.1.100') }}"
          ansible_user: "{{ lookup('env', 'JETSON_USER') | default('jetson') }}"
          ansible_port: 22
          
          # Device hostname (separate from connection IP)
          jetson_hostname: "{{ lookup('env', 'JETSON_HOSTNAME') | default('') }}"
          
          # Conditional authentication configuration
          ansible_ssh_private_key_file: >-
            {%- if lookup('env', 'USE_SSH_KEY_AUTH') | default('true') | bool -%}
            {{ lookup('env', 'SSH_PRIVATE_KEY_PATH') | default('/root/.ssh/id_rsa') }}
            {%- endif -%}
          
          ansible_ssh_pass: >-
            {%- if not (lookup('env', 'USE_SSH_KEY_AUTH') | default('true') | bool) -%}
            {{ lookup('env', 'JETSON_PASSWORD') | default('') }}
            {%- endif -%}
          
          # Become configuration (unified password)
          ansible_become: true
          ansible_become_method: sudo
          ansible_become_pass: "{{ lookup('env', 'JETSON_PASSWORD') | default('') }}"
          
          # Device-specific variables (architecture will be auto-detected)
          jetpack_version: "{{ lookup('env', 'JETSON_JETPACK_VERSION') | default('6.2') }}"
          
      vars:
        # Common variables for all Jetson devices
        ansible_python_interpreter: /usr/bin/python3
        device_type: nvidia_jetson_agx_orin 